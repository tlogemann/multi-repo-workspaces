[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ws-tool"
version = "0.1.0"
description = "Isolated multi-repository Git workspaces"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ws = "ws_tool.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ws_tool"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
